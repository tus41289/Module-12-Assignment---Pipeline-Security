name: security
on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GATE: secret scan — exit non-zero on a finding so the build fails
      - name: Secret scan (Gitleaks)
        run: |
          docker run -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --exit-code 1

      # REPORT: SAST — drop --error so it surfaces findings without blocking
      - name: SAST (Semgrep)
        if: always()
        run: |
          pip install semgrep
          semgrep scan --config auto

      # REPORT: dependency scan — surface findings without blocking
      - name: Dependency scan (Trivy)
        if: always()
        run: |
          docker run -v "${{ github.workspace }}:/repo" aquasec/trivy:latest \
            fs --scanners vuln --exit-code 0 /repo
