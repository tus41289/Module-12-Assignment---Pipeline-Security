name: security
on: [push, pull_request]

jobs:
  # GATE: a found secret fails the build
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks scans full git history
      - name: Secret scan (Gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --verbose --redact --exit-code 1

  # GATE: injectable code fails the build
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SAST (Semgrep)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep \
            semgrep scan --config auto --error

  # REPORT: surfaces vulnerable dependencies, never blocks
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency scan (Trivy)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" aquasec/trivy:latest \
            fs --scanners vuln --exit-code 0 /repo
